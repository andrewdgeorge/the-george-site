<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231C1710'/%3E%3Ctext x='32' y='44' font-family='Georgia%2C serif' font-size='28' font-weight='400' fill='%23C4973A' text-anchor='middle'%3ETG%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://thegeorgebhm.com/">
  <title>The George — Coming Soon | Downtown Birmingham, AL</title>
  <meta name="description" content="The George — an elegant private event space coming soon to downtown Birmingham, Alabama. Sign up to be the first to know.">
  <meta property="og:title" content="The George — Coming Soon">
  <meta property="og:description" content="An elegant space coming soon to downtown Birmingham, AL.">
  <meta property="og:image" content="https://thegeorgebhm.com/images/facade-watercolor.jpeg">
  <meta property="og:url" content="https://thegeorgebhm.com/">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">

  <style>
    /* ─────────────────────────────────────────────────
       THE GEORGE — Coming Soon gate
       Tokens and treatment mirror the main site (see DESIGN.md).
       Cream stone, gold light, ink. One accent, no fourth voice.
    ───────────────────────────────────────────────── */
    :root {
      --bg:        #F7F3EC;
      --bg-2:      #EDE8DF;
      --dark:      #1C1710;
      --amber:     #9E7A2E;
      --amber-l:   #B8922A;
      --amber-d:   rgba(158,122,46,0.10);
      --amber-b:   rgba(158,122,46,0.22);
      --brown:     #3A2F27;  /* the crest's charcoal brown */
      --ink:       #1C1710;
      --ink-2:     #3D3529;
      --muted:     #7A6E5F;
      --muted-l:   #A89B88;
      --brand:     'Cinzel', Georgia, serif;
      --serif:     'Cormorant Garamond', Georgia, serif;
      --sans:      'Jost', 'Helvetica Neue', Arial, sans-serif;
      --ls-tight:  0.12em;
      --ls-eyebrow:0.2em;
      --ls-hero:   0.32em;
      --r-sm:      2px;
      --r-md:      4px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      /* faint stone texture: two barely-there radial washes, no gradients on type */
      background-image:
        radial-gradient(120% 80% at 50% -10%, rgba(158,122,46,0.05), transparent 60%),
        radial-gradient(100% 60% at 50% 115%, rgba(28,23,16,0.035), transparent 55%);
    }

    main {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 2rem;
    }

    .gate {
      width: 100%;
      max-width: 34rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Entrance (the only animation; hero-slow easing) ── */
    .fade-up { opacity: 0; transform: translateY(1rem); animation: fadeUp 0.72s ease-out forwards; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.18s; }
    .d3 { animation-delay: 0.31s; }
    .d4 { animation-delay: 0.44s; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .fade-up { animation: none; opacity: 1; transform: none; }
    }

    /* ── Crest logo (contains the wordmark) ── */
    .logo-lockup { margin: 0; line-height: 0; }
    .logo-lockup img {
      width: min(74vw, 296px);
      height: auto;
      display: block;
    }

    .gold-rule {
      width: 3.5rem;
      height: 1px;
      background: var(--amber);
      margin: 2rem 0 2rem;
    }

    .tagline {
      font-family: var(--serif);
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.25rem, 3.5vw, 1.6rem);
      line-height: 1.5;
      color: var(--ink-2);
      max-width: 26rem;
      text-wrap: balance;
      margin-top: 2.25rem;
    }

    /* ── Sign-up ── */
    .signup {
      width: 100%;
      max-width: 26rem;
      margin-top: 3.25rem;
    }

    .signup-label {
      display: block;
      font-family: var(--sans);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: var(--ls-eyebrow);
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    .field-row {
      display: flex;
      gap: 0.6rem;
      align-items: stretch;
    }

    .field-row input[type="email"] {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--sans);
      font-size: 0.95rem;
      color: var(--ink);
      background: #FBF8F2;
      border: 1px solid var(--muted-l);
      border-radius: 9999px;
      padding: 0.85rem 1.4rem;
      transition: border-color 0.12s ease-out;
    }
    .field-row input[type="email"]::placeholder { color: var(--muted-l); }
    .field-row input[type="email"]:focus {
      outline: none;
      border-color: var(--amber);
    }
    .field-row input[type="email"]:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .btn {
      flex: 0 0 auto;
      font-family: var(--sans);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: var(--ls-tight);
      text-transform: uppercase;
      color: var(--bg);
      background: var(--brown);
      border: 1px solid var(--brown);
      border-radius: 9999px;
      padding: 0.85rem 1.85rem;
      cursor: pointer;
      transition: background 0.12s ease-out, border-color 0.12s ease-out, color 0.12s ease-out;
      white-space: nowrap;
    }
    .btn:hover { background: var(--amber); border-color: var(--amber); color: #fff; }
    .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .btn[disabled] { opacity: 0.55; cursor: default; }
    .btn[disabled]:hover { background: var(--brown); border-color: var(--brown); color: var(--bg); }

    /* honeypot — kept out of the layout and off assistive tech */
    .hp {
      position: absolute; left: -9999px; width: 1px; height: 1px;
      overflow: hidden;
    }

    .status {
      min-height: 1.25rem;
      margin-top: 0.95rem;
      font-family: var(--sans);
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--muted);
      text-align: left;
    }
    .status.is-error { color: #7A3B22; }
    .status.is-ok    { color: var(--amber); }

    /* success state replaces the form */
    .done {
      margin-top: 3.25rem;
      max-width: 26rem;
    }
    .done p {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.15rem;
      color: var(--ink-2);
      line-height: 1.6;
    }

    /* ── Footer brand stamp ── */
    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 2rem 1.5rem 2.5rem;
    }
    .brand-stamp {
      font-family: var(--sans);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: var(--ls-hero);
      text-transform: uppercase;
      color: var(--muted-l);
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-stamp::before, .brand-stamp::after {
      content: ""; display: inline-block; width: 1.5rem; height: 1px;
      background: var(--amber); opacity: 0.55;
    }

    @media (max-width: 460px) {
      .field-row { flex-direction: column; }
      .btn { padding: 0.9rem 1.5rem; }
      .brand-stamp { font-size: 0.6rem; letter-spacing: 0.24em; gap: 0.55rem; }
      .brand-stamp::before, .brand-stamp::after { width: 1rem; }
    }
  </style>
</head>

<body>
  <main>
    <div class="gate">
      <h1 class="logo-lockup fade-up d1">
        <img src="images/logo-crest.png" alt="The George" width="296" height="245" decoding="async">
      </h1>
      <p class="tagline fade-up d2">An elegant space coming soon to downtown Birmingham, AL</p>

      <section class="signup fade-up d3" aria-labelledby="signup-label">
        <form id="signup-form" novalidate>
          <label class="signup-label" id="signup-label" for="email">Sign up for updates</label>
          <div class="field-row">
            <input
              type="email"
              id="email"
              name="email"
              inputmode="email"
              autocomplete="email"
              placeholder="you@email.com"
              aria-describedby="signup-status"
              required>
            <button type="submit" class="btn" id="signup-btn">Sign up</button>
          </div>
          <!-- honeypot: real people leave this empty -->
          <div class="hp" aria-hidden="true">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" tabindex="-1" autocomplete="off">
          </div>
          <p class="status" id="signup-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var form   = document.getElementById('signup-form');
      var input  = document.getElementById('email');
      var btn    = document.getElementById('signup-btn');
      var hp      = document.getElementById('company');
      var status = document.getElementById('signup-status');
      var section = form.parentNode;

      // Mirror of the server-side check — instant feedback, one source of truth.
      var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function setStatus(msg, kind) {
        status.textContent = msg || '';
        status.className = 'status' + (kind ? ' is-' + kind : '');
      }

      function succeed() {
        var done = document.createElement('div');
        done.className = 'done';
        done.setAttribute('role', 'status');
        done.innerHTML = '<p>Thank you. You’re on the list — we’ll be in touch as The George opens.</p>';
        section.replaceChild(done, form);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (btn.disabled) return;

        var email = (input.value || '').trim().toLowerCase();

        if (!EMAIL_RE.test(email)) {
          setStatus('Please enter a valid email address.', 'error');
          input.focus();
          return;
        }

        setStatus('One moment…', null);
        btn.disabled = true;

        fetch('/.netlify/functions/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, company: hp.value || '' })
        }).then(function (res) {
          return res.json().then(function (data) { return { status: res.status, data: data }; });
        }).then(function (r) {
          if (r.status === 200) {
            succeed();
          } else if (r.status === 409) {
            setStatus('You’re already on the list — thank you.', 'ok');
            btn.disabled = false;
          } else {
            setStatus((r.data && r.data.error) || 'Please enter a valid email address.', 'error');
            btn.disabled = false;
          }
        }).catch(function () {
          setStatus('Something went wrong. Please try again in a moment.', 'error');
          btn.disabled = false;
        });
      });

      // Clear an error the moment the visitor starts correcting it.
      input.addEventListener('input', function () {
        if (status.classList.contains('is-error')) setStatus('', null);
      });
    })();
  </script>
</body>
</html>
